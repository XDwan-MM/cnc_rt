编译监听:
  stage: test
  tags:
    - hmi_v3
  script:
    - |
      PIPELINE_INFOS=()
      while IFS=, read -r project_id pipeline_id; do
        PIPELINE_INFOS+=("$project_id,$pipeline_id")
      done < pipeline_ids.txt

      MAX_RETRIES=60
      SLEEP_INTERVAL=60
      for (( i=1; i<=MAX_RETRIES; i++ )); do
        ALL_COMPLETED=true
        FAILED_PIPELINE=""
        
        for info in "${PIPELINE_INFOS[@]}"; do
          IFS=, read -r project_id pipeline_id <<< "$info"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "PRIVATE-TOKEN: glpat-LNLVSs3NGAx9BdY5dvfQ" \
            "http://10.2.29.14:8084/api/v4/projects/${project_id}/pipelines/${pipeline_id}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API Error (Project ${project_id}, Pipeline ${pipeline_id}): $RESPONSE_BODY"
            exit 1
          fi
          
          # STATUS=$(echo "$RESPONSE_BODY" | jq -r '.status')
          STATUS=$(echo "$RESPONSE_BODY" | jq -r 'if type == "array" then .[0].status else .status end')
          
          case "$STATUS" in
            success) echo "✅ Pipeline ${pipeline_id} (Project ${project_id}) completed successfully." ;;
            failed|canceled|skipped) 
              ALL_COMPLETED=false
              FAILED_PIPELINE="${pipeline_id} (Project ${project_id})"
              echo "❌ Pipeline ${pipeline_id} (Project ${project_id}) failed. Status: $STATUS"
              ;;
            running|pending) 
              ALL_COMPLETED=false
              echo "⏳ Pipeline ${pipeline_id} (Project ${project_id}) still running..."
              ;;
            *) echo "⚠️ Unknown status: $STATUS" ;;
          esac
        done
        
        if [ "$ALL_COMPLETED" = true ]; then
          echo "✅ All pipelines completed successfully!"
          exit 0
        else
          echo "⏳ Waiting for all pipelines to finish... (Retry $i/$MAX_RETRIES, Total: $((i*SLEEP_INTERVAL))s)"
          sleep $SLEEP_INTERVAL
        fi
      done
      
      echo "⏰ Timeout: Pipelines didn't complete within $((MAX_RETRIES*SLEEP_INTERVAL)) seconds (60 minutes)"
      exit 1
  needs: [远程触发]

