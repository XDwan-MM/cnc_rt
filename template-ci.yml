  - curl -uly_35b717:AP38qFMP2jfnFYm5gav4KV2EyXV -O  "http://10.2.30.32:8081/artifactory/source/ly/tag_bash/cnc/add_b.sh"
  - curl -uly_35b717:AP38qFMP2jfnFYm5gav4KV2EyXV -O  "http://10.2.30.32:8081/artifactory/source/ly/tag_bash/cnc/write.sh"
